services:
  app:
    platform: ${APP_PLATFORM:-linux/arm64}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SQLITE_PATH: /data/dns-management.db
      JWT_SECRET: change-to-a-long-random-secret
      TOKEN_ENCRYPTION_KEY: change-to-another-long-random-secret
      ADDR: :8080
      FRONTEND_DIR: /app/public
    volumes:
      - sqlite-data:/data
    ports:
      - "8080:8080"

volumes:
  sqlite-data:
